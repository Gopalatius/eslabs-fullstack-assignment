services:
  rest-api:
    build:
      context: .
      dockerfile: src/RestApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - "5090:8080"

  websocket-app:
    build:
      context: .
      dockerfile: src/WebSocketApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - "5091:8080"
